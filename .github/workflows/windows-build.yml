name: Windows V1 Build
on:
  workflow_dispatch:
  push:
    branches: [build/v1-foundation]
jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build frontend
        shell: pwsh
        run: |
          cd frontend
          npm install
          npm run build
      - name: Install backend and packager
        run: pip install -r backend/requirements.txt pyinstaller
      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name "CCSDESIGN-Rebuild" --collect-all trimesh --add-data "frontend/dist;frontend/dist" launcher.py
      - name: Add launch helper
        shell: pwsh
        run: |
          '@echo off
          cd /d "%~dp0"
          start "" "CCSDESIGN-Rebuild.exe"' | Set-Content -Encoding ascii "dist/CCSDESIGN-Rebuild/Start CCSDESIGN Rebuild.bat"
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/CCSDESIGN-Rebuild/CCSDESIGN-Rebuild.exe"
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              if ($p.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 1
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Packaged CCSDESIGN Rebuild did not become healthy." }
            $projects = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/projects" -TimeoutSec 2
            Write-Host "Packaged application health check passed."
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CCSDESIGN-Rebuild-Windows-V1
          path: dist/CCSDESIGN-Rebuild/
          if-no-files-found: error
