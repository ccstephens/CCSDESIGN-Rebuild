name: V1 CI

on:
  push:
    branches:
      - main
      - build/v1-foundation
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend
      - run: python -c "from backend.app.main import app; print(app.title)"
      - name: Backend smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.app.main import app
          c=TestClient(app)
          assert c.get('/api/health').status_code == 200
          p=c.post('/api/projects',json={'name':'CI Smoke'}); assert p.status_code == 200
          pid=p.json()['id']
          assert c.get(f'/api/projects/{pid}').status_code == 200
          assert c.delete(f'/api/projects/{pid}').status_code == 200
          print('backend smoke test passed')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
